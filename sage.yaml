name: "media-sampler3"
description: "Versatile media sampler: capture-time naming, self-describing EXIF/JSON provenance, dual upload+local-cache, fleet-portable node identity. Captures JPEG frames AND audio clips into the shared /local-cache (v2 cache-frame contract)."
version: "0.1.0"
namespace: "beckman"
authors: "Pete Beckman <pete.beckman@northwestern.edu>"
collaborators: "Waggle Team <https://wa8.gl>"
funding:
license: "The license agreed by Argonne National Laboratory"
keywords: "image, audio, sampling, camera, microphone, producer, local cache, ring buffer, exif, provenance"
homepage: "https://github.com/flint-pete/media-sampler3/blob/master/ecr-meta/ecr-science-description.md"
source:
  architectures:
    - "linux/arm64"
    - "linux/amd64"
  url: "https://github.com/flint-pete/media-sampler3.git"
  branch: "master"
# NOTE on credentials: camera credentials are read from the environment
# (CAMERA_USER / CAMERA_PASSWORD) ONLY -- never as args -- to keep them out of
# argv/process listings/scheduler records. Inject them via a Kubernetes Secret
# referenced by the job's pod spec (envFrom/secretRef), not as inputs here.
#
# NOTE on node identity: vsn / node_id / lat / lon resolve at runtime from the
# WAGGLE_NODE_* env (wes-nodeinfo-injection), then a readable
# /etc/waggle/node-manifest-v2.json, else a placeholder. Pods started with
# `pluginctl run` get neither, so pass --vsn (and --lat/--lon for EXIF GPS).
inputs:
  - id: "one-shot"
    type: "boolean"
  - id: "continuous"
    type: "int"
  - id: "stream"
    type: "string"
  - id: "name"
    type: "string"
  - id: "media"
    type: "string"
  - id: "audio-source"
    type: "string"
  - id: "source-type"
    type: "string"
  - id: "clip-seconds"
    type: "int"
  - id: "audio-format"
    type: "string"
  - id: "bandpass-fmax"
    type: "int"
  - id: "node-manifest"
    type: "string"
  - id: "camera-host"
    type: "string"
  - id: "camera-port"
    type: "int"
  - id: "camera-channel"
    type: "int"
  - id: "capture-timeout"
    type: "float"
  - id: "vsn"
    type: "string"
  - id: "lat"
    type: "float"
  - id: "lon"
    type: "float"
  - id: "plugin-version"
    type: "string"
  - id: "job"
    type: "string"
  - id: "task"
    type: "string"
  - id: "cache-root"
    type: "string"
  - id: "cache-name"
    type: "string"
  - id: "cache-max-count"
    type: "int"
  - id: "cache-max-mb"
    type: "float"
  - id: "from-cache"
    type: "string"
  - id: "node-id"
    type: "string"
  - id: "heartbeat-secs"
    type: "int"
  - id: "max-count"
    type: "int"
  - id: "max-runtime"
    type: "int"
